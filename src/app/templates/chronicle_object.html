{% extends "base.html" %} {% block title %}{{ obj_id }}{% endblock %} {% block head_style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chronicle_object.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/markdown_editor.css') }}" />
{% endblock %} {% block content %}
<div id="page-config" data-resource-type="{{ resource_type }}" data-object-id="{{ obj_id }}"></div>
<div class="chronicle-object-container" id="chronicle-object-container" data-loaded="false">
  <button id="chronicle-object-edit-btn" class="btn icon-btn" title="Bearbeiten">
    <svg
      viewBox="0 0 24 24"
      class="icon"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
    </svg>
  </button>
  <div class="text-container" id="chronicle-object-text-container">
    <h1 id="chronicle-object-name">Lade Objekt ...</h1>
  </div>
</div>

{% include "modals/modify_markdown.html" %}

<script
  type="module"
  src="{{ url_for('static', filename='js/modals/markdown_editor.js') }}"
></script>
<script
  type="module"
  src="{{ url_for('static', filename='js/pages/chronicle_object.js') }}"
></script>
{% endblock %}
